<style>

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}

.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);display:grid;place-items:center;font-size:18px}
.rm{flex:1;min-width:0;display:flex;align-items:center;gap:10px}

.rm b{display:block;font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.pf{padding:0;border:2px solid var(--line);background:none;border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
#note{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);background:var(--surf3);color:var(--text);font-size:12px;padding:6px 12px;border-radius:99px;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;z-index:4}
#note.on{opacity:1;transform:translate(-50%,12px)}
.wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% 0,color-mix(in srgb,var(--c) 14%,transparent),transparent)}

.hello h3{margin:0 0 2px;font-size:17px}
.hello p{margin:0;font-size:12.5px;color:var(--mute)}
.day{align-self:center;font-size:11px;color:var(--mute);background:var(--surf);border:1px solid var(--line);border-radius:99px;padding:2px 11px;margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:flex-end;margin-top:9px;max-width:92%;animation:pop .22s ease-out}
.row.same{margin-top:1px}
.row.mine{align-self:flex-end;flex-direction:row-reverse}
.row.same .av{visibility:hidden}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.m{background:var(--surf);border:1px solid var(--line);border-radius:16px 16px 16px 5px;padding:6px 11px 5px;overflow-wrap:anywhere;box-shadow:0 1px 0 #0003}

.who{font-size:12.5px;font-weight:650;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:1px}
.rk{font-size:9.5px;font-weight:800;letter-spacing:.02em;padding:1px 7px;border-radius:99px;background:var(--rc);color:#fff}
.tag{font-size:9.5px;font-weight:800;color:#1a1300;background:var(--gold);padding:1px 7px;border-radius:99px}
.tm{font-size:10px;color:var(--mute);margin-left:8px;white-space:nowrap}
.del{border:0;background:none;color:var(--mute);font-size:12px;padding:0 0 0 6px}
.sk{height:44px;border-radius:16px;background:linear-gradient(90deg,var(--surf),var(--surf2),var(--surf));background-size:200% 100%;animation:sh 1.2s infinite;margin-top:10px;width:60%}
.sk:nth-child(even){align-self:flex-end;width:48%}

.box{flex:1;display:flex;align-items:flex-end;background:var(--surf2);border:1px solid var(--line);border-radius:22px;padding:2px 4px 2px 4px;position:relative}

.chip.on{background:var(--gold);color:#1a1300;font-weight:800;font-size:12px;padding:0 10px}
#cnt{position:absolute;right:12px;top:-16px;font-size:10px;color:var(--mute);display:none}
.send{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gold),#e0602b);color:#1a1300;font-size:18px;font-weight:800;display:grid;place-items:center}
.send:active{transform:scale(.94)}
#dim{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:.25s;z-index:6}
#dim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);background:var(--surf);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:7;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--sh)}

.dh{padding:14px 14px 8px}
.dh h2{margin:0 0 10px;font-size:17px}
.dh h2 span{color:var(--gold)}
#q{width:100%;border:1px solid var(--line);background:var(--surf2);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit;outline:none}
#list{flex:1;overflow-y:auto;padding:0 8px 16px}
.sec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:14px 8px 6px}
.it{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:8px;border-radius:12px}
.it:hover,.it.on{background:var(--surf2)}
.it.on{box-shadow:inset 3px 0 0 var(--c)}
.it .ico{width:34px;height:34px;font-size:18px;border-radius:10px}
.it b{display:block;font-size:14px;line-height:1.2}

#setup{position:fixed;inset:0;background:#050816c8;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.card{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:20px;width:100%;max-width:370px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh)}
.card h2{margin:0;font-size:19px}
.card p{margin:0;color:var(--mute);font-size:13px}
.card label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:-4px}
.card input,.card select{font:inherit;color:var(--text);background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;width:100%}
.go{border:0;border-radius:12px;padding:13px;font-weight:800;background:linear-gradient(135deg,var(--gold),#e0602b);color:#1a1300;margin-top:4px}
</style>
</head>

const T=$("txt");
T.oninput=()=>{T.style.height="auto";T.style.height=Math.min(T.scrollHeight,110)+"px";const c=$("cnt");c.style.display=T.value.length>240?"block":"none";c.textContent=T.value.length+"/300"};
T.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("f").requestSubmit()}};
$("lfg").onclick=()=>{isLfg=!isLfg;$("lfg").classList.toggle("on",isLfg)};
EMO.forEach(x=>{const b=document.createElement("button");b.type="button";b.textContent=x;b.onclick=()=>{T.value+=x;T.focus();T.oninput()};$("emo").appendChild(b)});
$("emb").onclick=()=>{const e=$("emo");e.style.display=e.style.display==="flex"?"none":"flex"};
$("f").onsubmit=async e=>{
 e.preventDefault();const text=T.value.trim();if(!text)return;
 if(!prof.ign){openSetup();return}
 if(Date.now()-lastSend<1500){say("Easy there, slow down a little");return}
 lastSend=Date.now();T.value="";T.oninput();
 const m={text:text.slice(0,300),ign:prof.ign,rank:prof.rank,cc:prof.cc,uid,ts:Date.now(),lfg:isLfg};
 isLfg=false;$("lfg").classList.remove("on");
 if(!sb){(local[room]=local[room]||[]).push(m);render(local[room]);$("feed").scrollTop=1e9;return}
 const {data,error}=await sb.from("messages").insert({room,uid,ign:m.ign,rank:m.rank,cc:m.cc,text:m.text,lfg:m.lfg}).select().single();
 if(error)say(String(error.message||"").includes("slow")?"Easy there, slow down":"Couldn't send. Try again");else{push(data);$("feed").scrollTop=1e9}
};
CTY.forEach(([k,n])=>{const o=document.createElement("option");o.value=k;o.textContent=flag(k)+" "+n;$("cc").appendChild(o)});
function openSetup(){$("ign").value=prof.ign;$("rank").value=prof.rank;$("cc").value=prof.cc||"PH";$("setup").style.display="flex";$("ign").focus()}
$("meBtn").onclick=openSetup;
$("ign").onkeydown=e=>{if(e.key==="Enter")$("saveBtn").click()};
$("saveBtn").onclick=()=>{const n=$("ign").value.trim();if(!n){$("ign").focus();return}
 const first=!prof.ign;prof={ign:n,rank:$("rank").value,cc:$("cc").value};try{localStorage.setItem("mlbb_prof",JSON.stringify(prof))}catch(e){}
 $("setup").style.display="none";avatar($("meAv"),prof.ign);if(first){const k="c_"+prof.cc.toLowerCase();if(ROOMS[k])go(k)}};
avatar($("meAv"),prof.ign||"?");go(prof.ign&&ROOMS["c_"+(prof.cc||"").toLowerCase()]?"c_"+prof.cc.toLowerCase():"global");if(!prof.ign)openSetup();
try{if(window.supabase&&!!SB_URL){sb=supabase.createClient(SB_URL,SB_KEY);sub()}else say("Preview mode: add your Supabase keys")}catch(e){say("Offline preview")}
</script>
</body>
</html>
